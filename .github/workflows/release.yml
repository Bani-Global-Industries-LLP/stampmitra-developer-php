name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release; no registry credentials are used

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Tag matches StampMitra::VERSION
        run: |
          v="$(php -r 'require "vendor/autoload.php"; echo StampMitra\StampMitra::VERSION;')"
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != VERSION v$v"; exit 1; }
      - run: composer validate --strict --no-check-lock
      - run: composer test
      - run: composer stan
      - run: composer coverage:spec
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" --verify-tag
      # Packagist updates itself through its GitHub app / webhook (see RELEASING.md).
